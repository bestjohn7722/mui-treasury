name: Claude Code
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-checkout context"
        printf 'event=%s\n' "${GITHUB_EVENT_NAME:-}"
        printf 'ref=%s\n' "${GITHUB_REF:-}"
        printf 'sha=%s\n' "${GITHUB_SHA:-}"
        printf 'repo=%s\n' "${GITHUB_REPOSITORY:-}"
      continue-on-error: true
    - name: Checkout repository
      uses: actions/checkout@v4.3.1
      with:
        fetch-depth: 1
        ref: ${{ github.event.issue.pull_request != null && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG pre-sink (pnpm install) working tree inspection"
        printf 'GITHUB_REF=%s\n' "${GITHUB_REF:-}"
        if command -v git >/dev/null 2>&1; then
          git rev-parse HEAD 2>/dev/null || echo "GERALT_DBG no HEAD"
          git log -1 --oneline 2>/dev/null || echo "GERALT_DBG no log"
        else
          echo "GERALT_DBG git not available"
        fi
        if [ -f package.json ]; then
          echo "GERALT_DBG package.json present"
          grep -nE '"(preinstall|postinstall|prepare)"' package.json 2>/dev/null || echo "GERALT_DBG no lifecycle scripts matched"
        else
          echo "GERALT_DBG package.json absent"
        fi
        if [ -f .pnpmfile.cjs ]; then
          echo "GERALT_DBG .pnpmfile.cjs present"
          head -40 .pnpmfile.cjs 2>/dev/null || true
        else
          echo "GERALT_DBG .pnpmfile.cjs absent"
        fi
        ls -la 2>/dev/null | head -50 || true
      continue-on-error: true
    - name: Install dependencies
      run: pnpm install
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  issue_comment:
    types:
    - created
  pull_request_review_comment:
    types:
    - created
  issues:
    types:
    - opened
    - assigned
  pull_request_review:
    types:
    - submitted
